<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b100e">
  <title>The Grimwood</title>
  <meta name="description" content="Play The Grimwood card game online with friends or offline against AI.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌲</text></svg>">
</head>
<body>
  <!-- Icon sprite (Lucide-style line icons) -->
  <svg xmlns="http://www.w3.org/2000/svg" style="display:none">
    <defs>
      <symbol id="i-log" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></symbol>
      <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3M12 17h.01"/></symbol>
      <symbol id="i-leave" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></symbol>
      <symbol id="i-hand" viewBox="0 0 24 24"><path d="M18 11V6a2 2 0 0 0-4 0v5M14 10V4a2 2 0 0 0-4 0v2M10 10.5V6a2 2 0 0 0-4 0v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.9-6-2.3l-3.6-3.6a2 2 0 0 1 2.8-2.8L7 15"/></symbol>
      <symbol id="i-draw" viewBox="0 0 24 24"><rect x="3" y="7" width="13" height="15" rx="2"/><path d="M8 3h11a2 2 0 0 1 2 2v12M9.5 11v7M6 14.5h7"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
      <symbol id="i-skip" viewBox="0 0 24 24"><path d="m5 4 10 8-10 8V4zM19 5v14"/></symbol>
      <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="14" height="14" rx="2"/><path d="M4 16a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
      <symbol id="i-trophy" viewBox="0 0 24 24"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6M18 9h1.5a2.5 2.5 0 0 0 0-5H18M4 22h16M10 14.7V17c0 .6-.5 1-1 1.2C7.9 18.8 7 20.2 7 22M14 14.7V17c0 .6.5 1 1 1.2 1.1.6 2 2 2 3.8M18 2H6v7a6 6 0 0 0 12 0V2z"/></symbol>
      <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3l1.9 5.8L20 10l-6.1 1.2L12 17l-1.9-5.8L4 10l6.1-1.2zM19 17v4M17 19h4M5 3v3M3.5 4.5h3"/></symbol>
      <symbol id="i-place" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-bot" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="10" rx="2"/><circle cx="12" cy="5" r="2"/><path d="M12 7v4M8 16h.01M16 16h.01"/></symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><path d="M6 3l14 9-14 9V3z"/></symbol>
      <symbol id="i-enter" viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/></symbol>
      <symbol id="i-users" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/></symbol>
      <symbol id="i-history" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.8 9.8 0 0 0-6.7 2.7L3 8"/><path d="M3 3v5h5M12 7v5l4 2"/></symbol>
      <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></symbol>
      <symbol id="i-back" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></symbol>
      <symbol id="i-rune" viewBox="0 0 24 24"><path d="M7 3v18M7 4l9 4-9 4 9 9"/></symbol>
      <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 10l9-7 9 7v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></symbol>
      <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 15-6.7L21 8M21 3v5h-5M21 12a9 9 0 0 1-15 6.7L3 16M8 16H3v5"/></symbol>
    </defs>
  </svg>

  <header class="topbar">
    <h1 class="logo">Grimwood</h1>
    <div class="topbar-info" id="topbar-info"></div>
    <nav class="topbar-actions">
      <button class="ibtn" id="btn-log" type="button" hidden aria-label="Game log" title="Game log"><svg class="ic"><use href="#i-log"/></svg></button>
      <button class="ibtn" id="btn-rules" type="button" aria-label="How to play" title="How to play"><svg class="ic"><use href="#i-help"/></svg></button>
      <button class="ibtn" id="btn-leave" type="button" hidden aria-label="Leave game" title="Leave game"><svg class="ic"><use href="#i-leave"/></svg></button>
    </nav>
  </header>

  <!-- Home -->
  <main id="screen-home" class="screen">
    <section class="hero">
      <p class="tagline">A chaotic card game of combos, theft and sabotage.</p>
      <label class="field">
        <span>Your name</span>
        <input id="in-name" maxlength="16" autocomplete="nickname" placeholder="Wanderer">
      </label>
    </section>
    <div class="panels">
      <section class="panel">
        <h2>Play vs AI</h2>
        <p class="muted">Offline, in your browser.</p>
        <div class="field-row">
          <label class="field">
            <span>Opponents</span>
            <select id="in-bots">
              <option>1</option><option selected>2</option><option>3</option><option>4</option><option>5</option>
            </select>
          </label>
          <label class="field">
            <span>Difficulty</span>
            <select id="in-level">
              <option value="easy">Easy</option>
              <option value="normal" selected>Normal</option>
            </select>
          </label>
        </div>
        <div class="row">
          <button class="btn primary" id="btn-local" type="button"><svg class="ic"><use href="#i-play"/></svg>Play</button>
          <button class="btn" id="btn-resume" type="button" hidden><svg class="ic"><use href="#i-history"/></svg>Resume</button>
        </div>
      </section>
      <section class="panel">
        <h2>Play online</h2>
        <p class="muted" id="online-status">Create a room and share the code.</p>
        <div class="row">
          <button class="btn primary" id="btn-create" type="button"><svg class="ic"><use href="#i-users"/></svg>Create room</button>
        </div>
        <div class="row join-row">
          <input id="in-code" maxlength="5" placeholder="CODE" autocapitalize="characters" autocomplete="off" aria-label="Room code">
          <button class="ibtn solid" id="btn-join" type="button" aria-label="Join room" title="Join room"><svg class="ic"><use href="#i-enter"/></svg></button>
        </div>
        <button class="btn ghost" id="btn-rejoin" type="button" hidden><svg class="ic"><use href="#i-history"/></svg><span id="rejoin-label"></span></button>
      </section>
    </div>
  </main>

  <!-- Lobby -->
  <main id="screen-lobby" class="screen" hidden>
    <section class="panel lobby">
      <p class="muted small lobby-label">Room code</p>
      <div class="lobby-code-row">
        <span class="code" id="lobby-code"></span>
        <button class="ibtn solid" id="btn-copy" type="button" aria-label="Copy invite link" title="Copy invite link"><svg class="ic"><use href="#i-copy"/></svg></button>
      </div>
      <p class="muted small">Friends enter this code on the home screen, or open the invite link.</p>
      <ul class="lobby-list" id="lobby-players"></ul>
      <div class="row lobby-controls" id="lobby-host-controls" hidden>
        <select id="in-botlevel" aria-label="Bot difficulty">
          <option value="easy">Easy bot</option>
          <option value="normal" selected>Normal bot</option>
        </select>
        <button class="ibtn solid" id="btn-addbot" type="button" aria-label="Add bot" title="Add bot"><svg class="ic"><use href="#i-bot"/></svg></button>
        <button class="btn primary" id="btn-start" type="button"><svg class="ic"><use href="#i-play"/></svg><span id="start-label">Start</span></button>
      </div>
      <p class="muted" id="lobby-wait">Waiting for the host to start…</p>
    </section>
  </main>

  <!-- Game -->
  <main id="screen-game" class="screen game" hidden>
    <div class="table">
      <section class="seats" id="opponents" aria-label="Opponents"></section>
      <section class="center">
        <div class="piles">
          <button class="pile deck" id="pile-deck" type="button" aria-label="Draw from the deck">
            <span class="card back"><span class="card-icon" aria-hidden="true">🌲</span></span>
            <span class="pile-cta" id="deck-cta" aria-hidden="true"><svg class="ic"><use href="#i-draw"/></svg></span>
            <span class="pile-label" id="deck-count"></span>
          </button>
          <button class="pile" id="pile-discard" type="button" aria-label="View the discard pile">
            <span id="discard-top"></span>
            <span class="pile-label" id="discard-count"></span>
          </button>
          <div class="limbo" id="limbo"></div>
        </div>
        <div class="feed" id="feed" aria-live="polite"></div>
      </section>
      <section class="me" id="me" aria-label="You">
        <div class="me-head" id="me-head"></div>
        <div class="turnbar" id="turnbar"></div>
        <div class="me-row">
          <div class="chips mine" id="me-combos"></div>
          <div class="ready" id="ready"></div>
        </div>
        <div class="hand" id="hand" aria-label="Your hand"></div>
      </section>
    </div>
    <aside class="log-panel" aria-label="Game log">
      <h3>Chronicle</h3>
      <ol class="log" id="log"></ol>
    </aside>
  </main>

  <!-- Decision dock: shown when the game needs your choice -->
  <section class="decision" id="decision" hidden aria-live="assertive" aria-labelledby="decision-title">
    <h2 id="decision-title"></h2>
    <p class="decision-help" id="decision-help"></p>
    <div id="decision-reveal"></div>
    <div class="decision-options" id="decision-options"></div>
  </section>

  <!-- Card action menu -->
  <div class="card-pop" id="card-pop" hidden role="dialog" aria-labelledby="pop-title"></div>

  <!-- Info dialog (rules, discard pile, log, results) -->
  <dialog id="dlg-info" closedby="any" aria-labelledby="info-title">
    <div class="dlg-head">
      <h2 id="info-title"></h2>
      <form method="dialog"><button class="ibtn" aria-label="Close" title="Close"><svg class="ic"><use href="#i-x"/></svg></button></form>
    </div>
    <div id="info-body"></div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite" popover="manual"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
